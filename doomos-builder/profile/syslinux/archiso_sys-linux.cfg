LABEL doomos
TEXT HELP
Boot the DoomOS live medium on BIOS.
Features KDE Plasma 6 on Wayland with Btrfs auto-rollback.
ENDTEXT
MENU LABEL DoomOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% quiet splash cow_spacesize=10G
