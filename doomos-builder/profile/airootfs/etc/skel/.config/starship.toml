# ==============================================================================
# DoomOS Starship Prompt Configuration (Doctor Doom Emerald Aesthetic)
# ==============================================================================

format = """
[╭─](bold green)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$time
[╰─](bold green)\
$character"""

[character]
success_symbol = "[⚡](bold green) "
error_symbol = "[⚡](bold red) "

[directory]
style = "bold #22c55e"
truncation_length = 3
truncation_symbol = "…/"

[username]
style_user = "bold #16a34a"
style_root = "bold red"
format = "[$user]($style) "
show_always = false

[hostname]
ssh_only = false
format = "on [$hostname](bold #15803d) "

[git_branch]
symbol = " "
style = "bold #4ade80"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #86efac"
format = "([$all_status$ahead_behind]($style) )"

[time]
disabled = false
time_format = "%R"
style = "bold #166534"
format = "[ $time ]($style)"

[fill]
symbol = " "
