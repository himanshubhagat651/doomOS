# ==============================================================================
# DoomOS Pacman Configuration
# Multilib enabled with high-speed parallel downloads and visual enhancements
# ==============================================================================

[options]
HoldPkg     = pacman glibc
Architecture = auto
DisableSandbox

# Visual and Usability Improvements
Color
CheckSpace
ILoveCandy
ParallelDownloads = 5

# Security and Package Integrity (Optimized for build container)
SigLevel    = Never
LocalFileSigLevel = Optional

# ------------------------------------------------------------------------------
# Official Arch Linux Repositories
# ------------------------------------------------------------------------------

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Include = /etc/pacman.d/mirrorlist

# ------------------------------------------------------------------------------
# Pre-Compiled Distribution Software (Calamares, auto-cpufreq, ckbcomp)
# ------------------------------------------------------------------------------
[endeavouros]
SigLevel = Never
Server = https://mirror.moson.org/endeavouros/repo/$repo/$arch
Server = https://fastmirror.pp.ua/endeavouros/repo/$repo/$arch

[chaotic-aur]
SigLevel = Never
Server = https://geo-mirror.chaotic.cx/$repo/$arch
Server = https://cdn-mirror.chaotic.cx/$repo/$arch

