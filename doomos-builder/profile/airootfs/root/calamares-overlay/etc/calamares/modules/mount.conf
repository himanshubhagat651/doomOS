# ==============================================================================
# DoomOS Calamares Mount Configuration
# Defines exact Btrfs subvolume layout and zstd compression mount options
# ==============================================================================

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run

btrfsSubvolumes:
    - subvolume: "@"
      mountPoint: "/"
      subvolumeMountOptions: [ "noatime", "compress=zstd:3", "space_cache=v2" ]
    - subvolume: "@home"
      mountPoint: "/home"
      subvolumeMountOptions: [ "noatime", "compress=zstd:3", "space_cache=v2" ]
    - subvolume: "@snapshots"
      mountPoint: "/.snapshots"
      subvolumeMountOptions: [ "noatime", "compress=zstd:3", "space_cache=v2" ]
    - subvolume: "@var_log"
      mountPoint: "/var/log"
      subvolumeMountOptions: [ "noatime", "compress=zstd:3", "space_cache=v2" ]

btrfsSwapSubvol: "@swap"
mountOptions:
    - filesystem: default
      options: [ "defaults", "noatime" ]
    - filesystem: efi
      options: [ "defaults", "umask=0077" ]
    - filesystem: btrfs
      options: [ "defaults", "noatime", "compress=zstd:3", "space_cache=v2" ]
