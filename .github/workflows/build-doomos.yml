name: Build and Release DoomOS (ARM64 Apple Silicon VMware)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Master Build, Verification & Release Pipeline (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Validate Build Host Architecture
        run: |
          echo "Host Architecture: $(uname -m)"
          if [ "$(uname -m)" != "aarch64" ] && [ "$(uname -m)" != "arm64" ]; then
            echo "FATAL: Build host must be aarch64 Linux!"
            exit 1
          fi

      - name: 3. Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f
          df -h

      - name: 4. Set Execution Permissions on Scripts & Tests
        run: |
          chmod +x scripts/*.sh tests/*.sh doomos-builder/*.sh combine.sh test-vmware.sh flash-usb.sh verify-iso.sh

      - name: 5. Install Pinned Host Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xorriso mtools

      - name: 6. Execute Build Environment Pre-flight Check
        run: |
          ./scripts/check-build-environment.sh

      - name: 7. Execute Phase 0 Acceptance Tests (Architecture & Layout)
        run: |
          ./tests/test-phase0.sh

      - name: 8. Execute Phase 1 Acceptance Tests (Build Toolchain & Manifest)
        run: |
          ./tests/test-phase1-toolchain.sh

      - name: 9. Execute Phase 2 Acceptance Tests (Kernel & Hardware Drivers)
        run: |
          ./tests/test-phase2-kernel.sh

      - name: 10. Execute Phase 3 Acceptance Tests (Rootfs & Init Services)
        run: |
          ./tests/test-phase3-rootfs.sh

      - name: 11. Execute Phases 4 & 5 Acceptance Tests (Initramfs & UEFI Boot)
        run: |
          ./tests/test-phase4-phase5-boot.sh

      - name: 11b. Execute Step 2 Hardware Center Acceptance Tests
        run: |
          ./tests/test-step2-hardware-center.sh

      - name: 11c. Execute Step 3 Live Installer Acceptance Tests
        run: |
          ./tests/test-doomos-installer.sh

      - name: 12. Execute Combine & Multipart Reassembly Unit Tests
        run: |
          ./tests/test-combine.sh

      - name: 13. Clean Stale Build Artifacts
        run: |
          sudo rm -rf doomos-builder/output/* doomos-builder/work/*
          mkdir -p doomos-builder/output

      - name: 14. Build DoomOS Master ARM64 ISO via Container Engine
        run: |
          cd doomos-builder
          ./run-builder.sh

      - name: 15. Deep ISO & Subsystem Integrity Verification
        run: |
          ./tests/verify-iso.sh doomos-builder/output/doomos-plasma-aarch64.iso

      - name: 16. Validate Multipart Chunks & Release Manifest
        run: |
          cd doomos-builder/output
          ls -la doomos-plasma-aarch64.iso.part*
          if [ ! -f doomos-plasma-aarch64.iso.part00 ]; then
            echo "FATAL: part00 chunk missing!"
            exit 1
          fi
          if [ ! -f release-manifest.txt ]; then
            echo "FATAL: release-manifest.txt missing!"
            exit 1
          fi
          cat release-manifest.txt

      - name: 17. Client-Side Reassembly & Cryptographic SHA256 Gate
        run: |
          echo "Testing independent client-side reconstruction via combine.sh..."
          mkdir -p /tmp/doomos-reconstruction-test
          cp doomos-builder/output/doomos-plasma-aarch64.iso.part* /tmp/doomos-reconstruction-test/
          cp doomos-builder/output/doomos-plasma-aarch64.iso.sha256 /tmp/doomos-reconstruction-test/
          cp scripts/combine.sh /tmp/doomos-reconstruction-test/
          (cd /tmp/doomos-reconstruction-test && ./combine.sh)
          rm -rf /tmp/doomos-reconstruction-test
          echo "Reconstruction and SHA256 cryptographic match certified."

      - name: 18. Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.1.0"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: 19. Publish Certified Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: DoomOS ${{ steps.vars.outputs.TAG }} (Apple Silicon ARM64 VMware Edition)
          body_path: RELEASE_NOTES.md
          make_latest: true
          draft: false
          prerelease: false
          files: |
            doomos-builder/output/doomos-plasma-aarch64.iso.part*
            doomos-builder/output/doomos-plasma-aarch64.iso.sha256
            doomos-builder/output/release-manifest.txt
            combine.sh
            test-vmware.sh
            scripts/flash-usb.sh
            docs/ARCHITECTURE.md
            docs/VMWARE-VALIDATION.md
            DoomOS_Master_Specification.pdf
            TESTING_GUIDE.pdf
            VMWARE_GUIDE.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
