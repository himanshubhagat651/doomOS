# ==============================================================================
# DoomOS PipeWire Meeting Audio Loopback Configuration
# Creates a virtual audio sink that combines microphone + application audio
# for seamless screen sharing with sound in Discord, Slack, and Zoom on Wayland
# ==============================================================================

context.modules = [
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "DoomOS Meeting Share Sink"
            capture.props = {
                media.class = "Audio/Sink"
                node.name = "doomos_share_sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "doomos_share_source"
                media.class = "Audio/Source"
                audio.position = [ FL FR ]
                node.passive = true
            }
        }
    }
]
