# ==============================================================================
# DoomOS Laptop Power & Deep Sleep Configuration
# Fixes modern laptop suspend drain and prevents overheating in backpacks
# ==============================================================================

[Sleep]
# Prefer ACPI S3 deep sleep; fallback to modern standby (s2idle)
MemorySleepMode=deep s2idle

# Transition from suspend to hibernate after 30 minutes of inactivity on battery
HibernateDelaySec=1800

# Ensure RAM state is preserved during suspend
SuspendState=mem
