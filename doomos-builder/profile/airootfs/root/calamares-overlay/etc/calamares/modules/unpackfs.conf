# ==============================================================================
# DoomOS Calamares Unpackfs Configuration
# Unpacks live SquashFS rootfs to target installation root
# Supports both aarch64 and x86_64 image paths
# ==============================================================================
---
-   source: "/run/archiso/bootmnt/doomos/aarch64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""

-   source: "/run/archiso/bootmnt/doomos/x86_64/airootfs.sfs"
    sourcefs: "squashfs"
    destination: ""
