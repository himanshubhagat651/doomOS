<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="textGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Mask Emblem -->
  <g transform="translate(10, 10) scale(0.195)">
    <!-- Outer Shield/Ring -->
    <circle cx="256" cy="256" r="240" fill="#111418" stroke="#16a34a" stroke-width="12"/>
    <circle cx="256" cy="256" r="224" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="12 12" opacity="0.7"/>

    <!-- Mask Faceplate -->
    <path d="M 120 180 C 120 90, 200 60, 256 60 C 312 60, 392 90, 392 180 C 392 280, 370 380, 256 420 C 142 380, 120 280, 120 180 Z" fill="url(#metalDark)" stroke="#52525b" stroke-width="6"/>

    <!-- Brow Plate -->
    <path d="M 170 140 L 256 160 L 342 140 L 330 180 L 256 195 L 182 180 Z" fill="#27272a" stroke="#18181b" stroke-width="4"/>

    <!-- Glowing Eyes -->
    <path d="M 170 220 C 185 210, 225 215, 235 230 C 230 242, 200 248, 175 240 Z" fill="#000" stroke="#15803d" stroke-width="4"/>
    <path d="M 185 224 C 195 218, 220 222, 226 230 C 220 236, 202 240, 188 234 Z" fill="#22c55e" filter="url(#glow)"/>

    <path d="M 342 220 C 327 210, 287 215, 277 230 C 282 242, 312 248, 337 240 Z" fill="#000" stroke="#15803d" stroke-width="4"/>
    <path d="M 327 224 C 317 218, 292 222, 286 230 C 292 236, 310 240, 324 234 Z" fill="#22c55e" filter="url(#glow)"/>

    <!-- Nose Bridge -->
    <polygon points="256,200 244,285 256,295 268,285" fill="#3f3f46" stroke="#18181b" stroke-width="3"/>

    <!-- Jaw & Slots -->
    <path d="M 200 320 L 312 320 L 300 375 L 256 395 L 212 375 Z" fill="#1f2428" stroke="#3f3f46" stroke-width="4"/>
    <line x1="230" y1="335" x2="230" y2="355" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <line x1="243" y1="335" x2="243" y2="362" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <line x1="256" y1="335" x2="256" y2="368" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <line x1="269" y1="335" x2="269" y2="362" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
    <line x1="282" y1="335" x2="282" y2="355" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Typography: DoomOS -->
  <text x="135" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="#ffffff">DOOM<tspan fill="url(#textGreen)">OS</tspan></text>
  <text x="138" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="6" fill="#a1a1aa">NEXT-GEN LINUX</text>
</svg>
