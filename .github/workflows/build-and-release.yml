name: Build and Release DoomOS ISO (Multipart & VMware)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify & Publish Multipart ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f
          df -h

      - name: Set Execution Permissions
        run: |
          chmod +x doomos-builder/build.sh doomos-builder/run-builder.sh combine.sh test-vmware.sh flash-usb.sh verify-iso.sh publish-release.sh

      - name: Build DoomOS ISO via Container Engine
        run: |
          cd doomos-builder
          ./run-builder.sh

      - name: Verify ISO Integrity & Problem-Solving Subsystems
        run: |
          ./verify-iso.sh doomos-builder/output/doomos-plasma-x86_64.iso

      - name: Split ISO into Multipart Chunks (part01, part02)
        run: |
          cd doomos-builder/output
          echo "Splitting ISO into 2000MB multipart chunks..."
          split -b 2000M -d -a 2 doomos-plasma-x86_64.iso doomos-plasma-x86_64.iso.part
          
          # Rename 00 -> part01, 01 -> part02 for human-friendly numbering
          if [ -f doomos-plasma-x86_64.iso.part00 ]; then
            mv doomos-plasma-x86_64.iso.part00 doomos-plasma-x86_64.iso.part01
          fi
          if [ -f doomos-plasma-x86_64.iso.part01 ]; then
            mv doomos-plasma-x86_64.iso.part01 doomos-plasma-x86_64.iso.part02
          fi
          
          ls -la doomos-plasma-x86_64.iso.part*
          sha256sum doomos-plasma-x86_64.iso > doomos-plasma-x86_64.iso.sha256
          cat doomos-plasma-x86_64.iso.sha256

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish Multipart Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: DoomOS ${{ steps.vars.outputs.TAG }} (KDE Plasma 6 VMware Edition)
          body_path: RELEASE_NOTES.md
          files: |
            doomos-builder/output/doomos-plasma-x86_64.iso.part01
            doomos-builder/output/doomos-plasma-x86_64.iso.part02
            doomos-builder/output/doomos-plasma-x86_64.iso.sha256
            combine.sh
            DoomOS_Master_Specification.pdf
            TESTING_GUIDE.pdf
            test-vmware.sh
            flash-usb.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
