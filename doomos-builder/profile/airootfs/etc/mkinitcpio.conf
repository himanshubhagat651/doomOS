# ==============================================================================
# DoomOS Initramfs Configuration (mkinitcpio.conf)
# Hardened hook pipeline supporting Plymouth boot splash & Btrfs subvolumes
# ==============================================================================

# Kernel modules loaded early before filesystem mounting
MODULES=(btrfs)

# Custom binaries included in the initramfs
BINARIES=()

# Additional files to include in the initramfs image
FILES=()

# ==============================================================================
# HOOKS Sequence:
# - base udev: Core userspace device node creation
# - plymouth: Early graphical boot splash animation (zero console flicker)
# - autodetect: Strip unneeded drivers to minimize initramfs size
# - modconf kms: Early Kernel Mode Setting for native monitor resolutions
# - keyboard keymap consolefont: Early hardware input & typography
# - block btrfs: Block storage drivers and Btrfs subvolume mounting capability
# - filesystems fsck: Target filesystem check and root pivot
# ==============================================================================
HOOKS=(base udev plymouth autodetect modconf kms keyboard keymap consolefont block btrfs filesystems fsck)

# High-ratio multi-threaded Zstandard compression for rapid boot decompression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
