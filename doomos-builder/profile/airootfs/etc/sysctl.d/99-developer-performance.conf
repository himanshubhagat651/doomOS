# ==============================================================================
# DoomOS Developer & High-Performance Sysctl Configuration
# Prevents silent crashes in IDEs, compilers, databases, and heavy workloads
# ==============================================================================

# Prevent inotify handle exhaustion in large mono-repos (VS Code, Webpack, Vite, IntelliJ)
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 2048

# Increase virtual memory mapping areas (required by ElasticSearch, JVM, and Steam games)
vm.max_map_count = 2147483642

# Network connection backlog tuning for local development servers and container bridges
net.core.somaxconn = 8192

# Improve filesystem responsiveness under heavy I/O
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
