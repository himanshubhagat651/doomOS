# ==============================================================================
# DoomOS Calamares Master Pipeline Configuration
# ==============================================================================

modules-search: [ local, /usr/lib/calamares/modules ]

instances: []

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - doomos-rtc
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: doomos

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

quit-at-end: false
