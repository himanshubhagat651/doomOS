# ==============================================================================
# DoomOS Calamares Partition Module Configuration
# Configures Btrfs as the default filesystem with LUKS encryption support
# ==============================================================================

efi:
    mountPoint: "/boot/efi"
    recommendedSize: 1024M
    minimumSize: 512M
    label: "DOOM_BOOT"

defaultFileSystemType: "btrfs"

availableFileSystemTypes:
    - btrfs
    - ext4
    - xfs

enableLuksAutomatedPartitioning: true

initialPartitioningChoice: erase

defaultPartitionTableType: gpt

userSwapChoices:
    - none
    - small
    - suspend
    - file

drawNestedPartitions: false
alwaysShowPartitionLabels: true
