# ==============================================================================
# DoomOS Pacman Configuration (ARM64 / aarch64)
# Optimized for Arch Linux ARM & Apple Silicon VMware
# ==============================================================================

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
DisableSandbox

# Visual and Usability Improvements
Color
CheckSpace
ILoveCandy
ParallelDownloads = 5

# Security and Package Integrity (Optimized for build container)
SigLevel    = Never
LocalFileSigLevel = Optional

# ------------------------------------------------------------------------------
# Official Arch Linux ARM Repositories
# ------------------------------------------------------------------------------

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

# ------------------------------------------------------------------------------
# Pre-Compiled Distribution Software (Calamares, ckbcomp)
# ------------------------------------------------------------------------------
[endeavouros]
SigLevel = Never
Server = https://mirror.moson.org/endeavouros/repo/$repo/$arch
Server = https://mirror.alpix.eu/endeavouros/repo/$repo/$arch
