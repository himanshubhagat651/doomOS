# ==============================================================================
# DoomOS Initramfs Configuration (mkinitcpio.conf)
# Hardened hook pipeline supporting Archiso Live Medium & Btrfs subvolumes
# ==============================================================================

# Kernel modules loaded early before filesystem mounting
MODULES=(btrfs loop overlay squashfs)

# Custom binaries included in the initramfs
BINARIES=()

# Additional files to include in the initramfs image
FILES=()

# ==============================================================================
# HOOKS Sequence for Live Boot & Hardware Init:
# - base udev: Core userspace device node creation
# - modconf kms: Early Kernel Mode Setting for native monitor resolutions
# - archiso archiso_loop_mnt: Discovery & mounting of live ISO media / airootfs.sfs
# - block btrfs: Block storage drivers and Btrfs filesystem support
# - filesystems: Filesystem drivers for root pivot
# - keyboard: Keyboard input
# ==============================================================================
HOOKS=(base udev modconf kms archiso archiso_loop_mnt block btrfs filesystems keyboard)

# High-ratio multi-threaded Zstandard compression for rapid boot decompression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)
