<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="doomGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle / Crest -->
  <circle cx="256" cy="256" r="240" fill="#111418" stroke="url(#doomGreen)" stroke-width="8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Doctor Doom Titanium Faceplate Mask -->
  <!-- Outer Hood Shadow -->
  <path d="M 120 180 C 120 90, 200 60, 256 60 C 312 60, 392 90, 392 180 C 392 280, 370 380, 256 420 C 142 380, 120 280, 120 180 Z" fill="url(#metalDark)" stroke="#52525b" stroke-width="4"/>

  <!-- Forehead Plates & Rivets -->
  <path d="M 170 140 L 256 160 L 342 140 L 330 180 L 256 195 L 182 180 Z" fill="#27272a" stroke="#18181b" stroke-width="3"/>
  <circle cx="195" cy="155" r="4" fill="#a1a1aa"/>
  <circle cx="256" cy="172" r="4" fill="#a1a1aa"/>
  <circle cx="317" cy="155" r="4" fill="#a1a1aa"/>

  <!-- Sinister Eye Sockets (Glowing Emerald Green) -->
  <path d="M 170 220 C 185 210, 225 215, 235 230 C 230 242, 200 248, 175 240 Z" fill="#000" stroke="#15803d" stroke-width="3"/>
  <path d="M 185 224 C 195 218, 220 222, 226 230 C 220 236, 202 240, 188 234 Z" fill="#22c55e" filter="url(#glow)"/>

  <path d="M 342 220 C 327 210, 287 215, 277 230 C 282 242, 312 248, 337 240 Z" fill="#000" stroke="#15803d" stroke-width="3"/>
  <path d="M 327 224 C 317 218, 292 222, 286 230 C 292 236, 310 240, 324 234 Z" fill="#22c55e" filter="url(#glow)"/>

  <!-- Metal Nose Bridge -->
  <polygon points="256,200 244,285 256,295 268,285" fill="#3f3f46" stroke="#18181b" stroke-width="2"/>

  <!-- Titanium Jaw & Ventilation Grille -->
  <path d="M 200 320 L 312 320 L 300 375 L 256 395 L 212 375 Z" fill="#1f2428" stroke="#3f3f46" stroke-width="3"/>
  <!-- Grille Slots (Glowing Emerald Green) -->
  <line x1="225" y1="335" x2="225" y2="355" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="335" x2="240" y2="362" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="335" x2="256" y2="368" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="272" y1="335" x2="272" y2="362" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <line x1="287" y1="335" x2="287" y2="355" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>

  <!-- Cheek Titanium Seams & Bolts -->
  <line x1="150" y1="260" x2="200" y2="320" stroke="#52525b" stroke-width="3"/>
  <line x1="362" y1="260" x2="312" y2="320" stroke="#52525b" stroke-width="3"/>
  <circle cx="160" cy="275" r="3.5" fill="#a1a1aa"/>
  <circle cx="352" cy="275" r="3.5" fill="#a1a1aa"/>
</svg>
